schema: spec-driven

context: |
  Tech stack: npm workspaces monorepo with NestJS/Prisma API, React/Vite web, shared TypeScript package.
  Architecture: API modules by domain; web currently uses feature folders plus overloaded main.tsx pending refactor.
  Testing: Vitest is available in @camiones/api; workspace typecheck and lint scripts exist.
  Style: TypeScript strictness via tsconfig projects, ESLint per API/web workspace, no formatter script detected.
  Workflow: start from develop; create one branch per SDD change.

strict_tdd: true

testing:
  detected: "2026-05-15"
  strict_tdd: true
  test_runner:
    framework: vitest
    command: "npm run test:api && npm run test --workspace @camiones/web"
  layers:
    unit:
      available: true
      tool: vitest
    integration:
      available: true
      tool: "@nestjs/testing + Vitest; Testing Library + jsdom"
    e2e:
      available: false
      tool: null
  coverage:
    available: false
    command: null
  quality:
    linter:
      available: true
      command: "npm run lint"
    type_checker:
      available: true
      command: "npm run typecheck"
    formatter:
      available: false
      command: null

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
    - Create each accepted change from develop on its own branch
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Keep work-unit commits reviewable and branch-scoped
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas or large removals
